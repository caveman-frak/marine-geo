server:
  shutdown: "graceful"
  compression:
    enabled: true
    min-response-size: 2048

spring:
  application:
    name: Marine Geographic Server
  lifecycle:
    timeout-per-shutdown-phase: "5s"
  output:
    ansi:
      enabled: "always"
  jackson:
    serialization:
      indent_output: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
      path: /h2-console
      settings.trace: false
      settings.web-allow-others: true
  liquibase:
    enabled: true
    changelog: config/liquibase/master.yaml
    contexts: ddl,static,system,test
    user: sa
    password:
    default-schema: public
    liquibase-schema: public
  thymeleaf:
    cache: false

hibernate:
  hbm2ddl:
    auto: none

management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"
    jmx:
      exposure:
        include: "*"

app:
  name: "${name}"
  description: "${description}"
  version: "${version}"

logging:
  group:
    bluegecko: "uk.co.bluegecko"
    noise: "org.apache,
      org.springframework,
      javax.management,
      com.zaxxer.hikari,
      tech.units.indriya,
      org.springdoc"
    database: "org.hibernate,
      org.hibernate.SQL,
      org.hibernate.orm.jdbc.bind,
      org.hibernate.stat,
      org.hibernate.SQL_SLOW,
      org.hibernate.cache,
      com.zaxxer.hikari,
      liquibase"
  level:
    root: "info"
    bluegecko: "debug"
    noise: "info"
    database: "info"